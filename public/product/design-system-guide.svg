<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">OpenUI design system concept</title><desc id="desc">An illustrated dark design-system workspace and phone with shared orange accents, color tokens, typography and buttons.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#201411"/><stop offset=".55" stop-color="#a03c15"/><stop offset="1" stop-color="#ff792d"/></linearGradient><radialGradient id="glow"><stop stop-color="#ff8d38" stop-opacity=".8"/><stop offset="1" stop-color="#ff8d38" stop-opacity="0"/></radialGradient><filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-opacity=".45"/></filter></defs>
<rect width="1600" height="1000" fill="url(#bg)"/><ellipse cx="1330" cy="270" rx="550" ry="400" fill="url(#glow)"/>
<g filter="url(#shadow)"><rect x="95" y="155" width="1210" height="720" rx="30" fill="#101112" stroke="#4a403a" stroke-width="3"/><path d="M335 156V875" stroke="#303031"/>
<g font-family="Arial,sans-serif"><text x="132" y="215" fill="#fff" font-size="33" font-weight="700">Open<tspan fill="#ff6a26">UI</tspan></text><rect x="122" y="254" width="185" height="48" rx="10" fill="#342019"/><g fill="#a9a7a5" font-size="18"><text x="143" y="285" fill="#ff8a45">Design System</text><text x="143" y="348">Colors</text><text x="143" y="405">Typography</text><text x="143" y="462">Components</text><text x="143" y="519">Icons</text><text x="143" y="576">Layouts</text></g>
<text x="380" y="245" fill="#fff" font-size="43" font-weight="700">Design System</text><text x="382" y="283" fill="#999" font-size="18">Shared decisions. Consistent interfaces.</text><rect x="1120" y="209" width="132" height="43" rx="12" fill="#ff6a26"/><text x="1156" y="237" fill="#101010" font-size="17" font-weight="700">Export ↗</text>
<text x="383" y="348" fill="#fff" font-size="22" font-weight="600">Colors</text><g><rect x="383" y="373" width="126" height="86" rx="13" fill="#ff6a26"/><rect x="535" y="373" width="126" height="86" rx="13" fill="#ff9b52"/><rect x="687" y="373" width="126" height="86" rx="13" fill="#080808" stroke="#333"/><rect x="839" y="373" width="126" height="86" rx="13" fill="#242426"/><rect x="991" y="373" width="126" height="86" rx="13" fill="#faf8f5"/></g><g fill="#aaa" font-size="15"><text x="383" y="489">Primary</text><text x="535" y="489">Secondary</text><text x="687" y="489">Background</text><text x="839" y="489">Surface</text><text x="991" y="489">Text</text></g>
<text x="383" y="551" fill="#fff" font-size="22" font-weight="600">Buttons</text><rect x="383" y="576" width="207" height="48" rx="11" fill="#ff6a26"/><text x="411" y="606" fill="#111" font-size="17" font-weight="700">Primary Button →</text><rect x="609" y="576" width="167" height="48" rx="11" fill="#242426"/><text x="645" y="606" fill="#ddd" font-size="17">Secondary</text><rect x="795" y="576" width="137" height="48" rx="11" fill="none" stroke="#555"/><text x="833" y="606" fill="#ddd" font-size="17">Outline</text>
<text x="383" y="690" fill="#fff" font-size="22" font-weight="600">Typography</text><text x="383" y="764" fill="#faf8f5" font-size="64" font-weight="700">Aa</text><text x="494" y="724" fill="#ddd" font-size="20" font-weight="600">Clear headings</text><text x="494" y="759" fill="#999" font-size="18">Readable text. A consistent rhythm.</text></g></g>
<g transform="translate(1225 370) rotate(9)" filter="url(#shadow)"><rect width="268" height="514" rx="43" fill="#090a0b" stroke="#aaa" stroke-width="4"/><rect x="13" y="14" width="242" height="486" rx="32" fill="#171719"/><rect x="92" y="23" width="84" height="18" rx="9" fill="#050505"/><g font-family="Arial,sans-serif"><text x="32" y="92" fill="#fff" font-size="24" font-weight="700">Open<tspan fill="#ff6a26">UI</tspan></text><text x="32" y="162" fill="#fff" font-size="29" font-weight="700"><tspan x="32">Turn ideas</tspan><tspan x="32" dy="39">into beautiful</tspan><tspan x="32" dy="39" fill="#ff8a45">interfaces.</tspan></text><text x="32" y="297" fill="#aaa" font-size="15"><tspan x="32">One visual language.</tspan><tspan x="32" dy="24">Every screen.</tspan></text><rect x="30" y="365" width="208" height="45" rx="12" fill="#ff6a26"/><text x="72" y="393" fill="#111" font-size="16" font-weight="700">Get started →</text><circle cx="63" cy="454" r="8" fill="#ff6a26"/><circle cx="134" cy="454" r="8" fill="#777"/><circle cx="205" cy="454" r="8" fill="#777"/></g></g>
