<!DOCTYPE html><html><head><style>body{margin:0;font-family:Arial,sans-serif;background:#f7f8fc;color:#182034}main{padding:24px;box-sizing:border-box}h1{font-size:28px;margin:0 0 12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.card{background:white;border:1px solid #dce1eb;border-radius:16px;padding:16px}.action{background:#2563eb;color:white;border:0;border-radius:10px;padding:12px 18px}.photo{display:block;width:160px;height:80px;object-fit:cover;border-radius:8px}nav{display:flex;gap:12px;margin-bottom:16px}input{padding:8px;border:1px solid #ccd2df;border-radius:6px}svg{vertical-align:middle}p{font-size:14px}</style></head><body><main><nav aria-label="Demo navigation"><a href="#details">Details</a><a href="#settings">Settings</a></nav><h1>Mobile heading</h1><p>Independent screen content.</p><div class="cards"><section class="card" aria-label="Demo card"><h2>Training summary</h2><p>Move this card without moving its neighbor.</p><button class="action"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"><path d="M5 12h14m-6-6 6 6-6 6"/></svg><span>Start demo</span></button><img class="photo" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22100%22%3E%3Crect width=%22200%22 height=%22100%22 fill=%22%232563eb%22/%3E%3C/svg%3E" alt="Blue demo image"><label>Email <input type="email" placeholder="name@example.com" value="demo@example.com"></label></section><section class="card" aria-label="Neighbor card"><h2>Weekly chart</h2><svg aria-label="Weekly bars" viewBox="0 0 200 80" width="200" height="80"><rect x="10" y="30" width="24" height="50" fill="#2563eb"/><rect x="50" y="10" width="24" height="70" fill="#2563eb"/></svg><p id="details">This section must stay intact.</p></section></div></main></body></html>
